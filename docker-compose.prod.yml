# Build-time public env for Next.js. Only interpolate vars that must exist in
# shared/.env — optionals use Dockerfile ARG defaults (Hub flags compose interpolations as required).
x-web-build-args: &web-build-args
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
  NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
  NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PUERTO_POSTGRES}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  seed:
    build:
      context: .
      dockerfile: apps/api-nest/Dockerfile.seed
    restart: "no"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
      RUN_SEEDS: ${RUN_SEEDS:-false}
      SEED_SUITE: prod
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    command: >
      sh -c "
        set -e
        echo 'Running migrations...'
        npx prisma migrate deploy || {
          echo '=== migrate deploy failed — trying P3009 repair ==='
          # 20260717120000 aborted on production (it backfilled codes by hardcoded
          # id, so rows past id 18 stayed NULL and SET NOT NULL failed). Postgres
          # migrations run in a transaction, so nothing of it landed: mark it
          # applied so 20260722130000_fix_system_functionality_codes can do the
          # backfill correctly. No-op on databases that are not stuck.
          npx prisma migrate resolve --applied 20260717120000_add_code_to_system_functionalities || true
          npx prisma migrate deploy || {
            echo '=== prisma migrate deploy FAILED — status ==='
            npx prisma migrate status || true
            exit 1
          }
        }
        echo '=== Seed gate (RUN_SEEDS='"${RUN_SEEDS:-false}"') ==='
        sh scripts/run-seeds-if-needed.sh || {
          echo '=== Seed gate FAILED ==='
          exit 1
        }
        echo '=== Seed step completed (ran or skipped) ==='
      "
    networks:
      - app-network

  markitdown:
    build:
      context: .
      dockerfile: apps/markitdown/Dockerfile
    restart: unless-stopped
    ports:
      - "5003:5000"
    volumes:
      - uploads_data:/app/apps/api-nest/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app-network

  api-nest:
    build:
      context: .
      dockerfile: apps/api-nest/Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5001"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      MARKITDOWN_URL: http://markitdown:5000
      PRISMA_QUERY_ENGINE_LIBRARY: /app/node_modules/.prisma/client/libquery_engine-linux-musl-openssl-3.0.x.so.node
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
      # Optional AI/auth/security keys come from env_file (.env) — not interpolated,
      # so Hub does not mark them required. App code has its own fallbacks.
    ports:
      - "${PUERTO_BACKEND_NEST}:5001"
    volumes:
      - uploads_data:/app/apps/api-nest/uploads
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
        restart: true
      markitdown:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\" || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
      args:
        <<: *web-build-args
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      <<: *web-build-args
    ports:
      - "${PUERTO_FRONTEND}:3000"
    depends_on:
      api-nest:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\" || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  app-network:
    driver: bridge
